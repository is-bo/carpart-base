<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products — AutoPartsOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF1F4}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
button{transition:background-color .12s,border-color .12s,color .12s}
[data-row]:hover{background:#EDF3FD}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; display: flex; overflow: hidden; background: #EEF1F4; font-family: Inter, 'Noto Sans Arabic', system-ui, sans-serif; color: #172033; font-variant-numeric: tabular-nums">
  <dc-import name="Sidebar" active="products" hint-size="232px,1080px"></dc-import>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="TopBar" hint-size="1688px,60px"></dc-import>
    <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 600; color: #14213D">Products</h1>
          <span style="font-size: 13px; color: #667085">2 418 products · 312 brands · 1 960 linked to vehicles</span>
        </div>
        <div style="display: flex; gap: 12px">
          <button type="button" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid #D7DCE3; background: #F7F8FA; color: #172033; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m17 8-5-5-5 5"></path><path d="M12 3v12"></path></svg>
            Import list
          </button>
          <button type="button" style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid #2563EB; background: #2563EB; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            Add Product
          </button>
        </div>
      </div>

      <section style="flex-grow: 1; min-height: 0; background: #F4F8FF; border: 1px solid #D7DCE3; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 248px minmax(0, 1fr)">
        <nav aria-label="Categories" style="background: #F7F8FA; border-inline-end: 1px solid #D7DCE3; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="padding: 0 10px 8px; font-size: 12px; font-weight: 600; color: #667085">Categories</span>
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="12">
            <a href="#" style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: {{c.weight}}; color: {{c.fg}}; background: {{c.bg}}">
              <span>{{c.name}}</span>
              <span style="font-size: 12px; font-weight: 500; color: {{c.countFg}}">{{c.count}}</span>
            </a>
          </sc-for>
        </nav>

        <div style="min-width: 0; min-height: 0; display: flex; flex-direction: column">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-bottom: 1px solid #D7DCE3">
            <div style="display: flex; align-items: center; gap: 12px">
              <label style="position: relative; display: flex; align-items: center; flex-grow: 1; max-width: 760px; height: 48px; box-sizing: border-box; padding: 0 14px 0 46px; background: #F4F8FF; border: 1px solid #D7DCE3; border-radius: 10px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset-inline-start: 15px; top: 13px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search products</span>
                <input type="search" placeholder="Search name, reference, OEM number, brand or vehicle…" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #172033">
                <span style="font-size: 12px; color: #8A94A6">e.g. “filtre huile logan” or “W 75/3”</span>
              </label>
              <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
                <button type="button" style="height: 42px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid #D7DCE3; background: #F4F8FF; font-family: inherit; font-size: 14px; font-weight: 500; color: #172033; cursor: pointer">
                  <span style="color: #667085">{{f.label}}</span>{{f.value}}
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                </button>
              </sc-for>
            </div>
          </div>

          <div role="table" aria-label="Products" style="flex-grow: 1; min-height: 0; overflow: hidden">
            <div role="row" style="position: sticky; top: 0; display: grid; grid-template-columns: {{cols}}; align-items: center; column-gap: 16px; height: 44px; padding: 0 12px 0 20px; background: #F7F8FA; border-bottom: 1px solid #D7DCE3; font-size: 13px; font-weight: 500; color: #667085">
              <span role="columnheader" aria-sort="ascending" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #1D4ED8">Product <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></span>
              <span role="columnheader">Reference</span>
              <span role="columnheader">Brand</span>
              <span role="columnheader" style="text-align: end">Stock</span>
              <span role="columnheader" style="text-align: end">Price</span>
              <span role="columnheader">Status</span>
              <span role="columnheader"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></span>
            </div>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
              <div role="row" data-row="1" style="display: grid; grid-template-columns: {{cols}}; align-items: center; column-gap: 16px; height: 56px; padding: 0 12px 0 20px; border-bottom: 1px solid #E3E7ED; font-size: 14px; background: {{r.bg}}">
                <span role="cell" style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
                  <span style="font-weight: 600; color: #14213D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                  <span style="font-size: 13px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.cat}} · {{r.fit}}</span>
                </span>
                <span role="cell" style="font-weight: 500; white-space: nowrap">{{r.ref}}</span>
                <span role="cell">{{r.brand}}</span>
                <span role="cell" style="text-align: end; font-weight: 600; color: {{r.stockFg}}">{{r.stock}}</span>
                <span role="cell" style="text-align: end; font-weight: 600">{{r.price}}</span>
                <span role="cell"><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: {{r.b.bg}}; color: {{r.b.fg}}; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{r.b.dot}}"></span>{{r.b.label}}</span></span>
                <span role="cell" style="display: flex; justify-content: center"><button type="button" aria-label="More actions" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #667085; font-size: 18px; line-height: 1; cursor: pointer">⋯</button></span>
              </div>
            </sc-for>
          </div>

          <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #F7F8FA; border-top: 1px solid #D7DCE3; font-size: 13px; color: #667085">
            <span>Showing 1–14 of 312 in Brakes</span>
            <div style="display: flex; align-items: center; gap: 6px">
              <button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #D7DCE3; background: #F4F8FF; color: #8A94A6; font-family: inherit; font-size: 13px; font-weight: 500">Previous</button>
              <button type="button" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #2563EB; background: #E8F0FE; color: #1D4ED8; font-family: inherit; font-size: 13px; font-weight: 600">1</button>
              <button type="button" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D7DCE3; background: #F4F8FF; color: #172033; font-family: inherit; font-size: 13px; font-weight: 500">2</button>
              <button type="button" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid #D7DCE3; background: #F4F8FF; color: #172033; font-family: inherit; font-size: 13px; font-weight: 500">3</button>
              <span style="padding: 0 4px">…</span>
              <button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #D7DCE3; background: #F4F8FF; color: #172033; font-family: inherit; font-size: 13px; font-weight: 500">Next</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const B = {
      ok: { label: 'In stock', bg: '#E7F6EC', fg: '#0F7A33', dot: '#16A344' },
      low: { label: 'Low Stock', bg: '#FDF1E1', fg: '#A15A06', dot: '#D97706' },
      out: { label: 'Out of Stock', bg: '#FDECEC', fg: '#B91C1C', dot: '#DC2626' },
      off: { label: 'Inactive', bg: '#EEF1F4', fg: '#475467', dot: '#8A94A6' }
    };
    const p = (name, cat, fit, ref, brand, stock, price, b) => ({ name, cat, fit, ref, brand, stock, price, b, stockFg: b === B.out ? '#B91C1C' : (b === B.low ? '#A15A06' : '#172033'), bg: '' });
    const rows = [
      p('Front Brake Pad Set', 'Brakes', 'Renault Symbol II, Clio III 1.2', '0 986 494 186', 'Bosch', '14', '4 850 DA', B.ok),
      p('Front Brake Pad Set', 'Brakes', 'Dacia Logan I, Sandero I', 'GDB1550', 'TRW', '6', '4 200 DA', B.ok),
      p('Front Brake Pad Set', 'Brakes', 'Symbol II, Clio III', '301 474', 'Valeo', '3', '3 950 DA', B.low),
      p('Front Brake Pad Set, ceramic', 'Brakes', 'Clio III 1.5 dCi', 'P 68 033', 'Brembo', '0', '6 300 DA', B.out),
      p('Front Brake Disc (pair)', 'Brakes', 'Symbol II, Clio III 1.2', '09.A727.11', 'Brembo', '2', '9 800 DA', B.low),
      p('Front Brake Disc (pair)', 'Brakes', 'Hyundai Accent RB 1.4', '0 986 479 R80', 'Bosch', '7', '8 900 DA', B.ok),
      p('Rear Brake Shoe Set', 'Brakes', 'Symbol II, Logan I', 'FSB596', 'Ferodo', '9', '3 600 DA', B.ok),
      p('Rear Brake Drum', 'Brakes', 'Logan I, Sandero I', 'DB4413', 'TRW', '4', '5 400 DA', B.ok),
      p('Front Brake Pad Set', 'Brakes', 'Peugeot 208 1.6 HDi', '573 604 J', 'Jurid', '11', '5 100 DA', B.ok),
      p('Front Brake Pad Set', 'Brakes', 'VW Golf 7, Seat Leon III', 'GDB1957', 'TRW', '5', '7 450 DA', B.ok),
      p('Brake Pad Wear Sensor', 'Brakes', 'Symbol II, Clio III', '176 45', 'Febi Bilstein', '11', '650 DA', B.ok),
      p('Brake Master Cylinder', 'Brakes', 'Kia Picanto II 1.2', '0 204 123 715', 'Bosch', '1', '14 200 DA', B.low),
      p('Front Caliper Repair Kit', 'Brakes', 'Symbol II, Logan I', 'D4-1052', 'Autofren Seinsa', '4', '1 850 DA', B.ok),
      p('Brake Hose, front', 'Brakes', 'Hyundai i10 2008–2013', 'BH778226', 'Jurid', '0', '1 300 DA', B.off)
    ];
    rows[0].bg = '#E8F0FE';
    const cat = (name, count, active) => ({ name, count, bg: active ? '#E8F0FE' : 'transparent', fg: active ? '#1D4ED8' : '#172033', countFg: active ? '#1D4ED8' : '#8A94A6', weight: active ? 600 : 500 });
    return {
      cols: 'minmax(0, 1fr) 160px 150px 80px 120px 140px 40px',
      rows,
      cats: [
        cat('All products', '2 418', false),
        cat('Brakes', '312', true),
        cat('Filters', '284', false),
        cat('Engine', '401', false),
        cat('Suspension & steering', '236', false),
        cat('Electrical & ignition', '298', false),
        cat('Cooling', '142', false),
        cat('Clutch & transmission', '118', false),
        cat('Oils & fluids', '96', false),
        cat('Body & lighting', '254', false),
        cat('Belts & chains', '87', false),
        cat('Accessories', '190', false)
      ],
      filters: [
        { label: 'Brand', value: 'All' },
        { label: 'Vehicle', value: 'Any' },
        { label: 'Stock', value: 'Any' }
      ]
    };
  }
}
</script>
</body>
</html>
