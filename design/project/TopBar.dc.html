<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoPartsOS top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 1688px; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #F7F5F0; border-bottom: 1px solid #D3CEC4; font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #26241F">
  <label style="position: relative; display: flex; align-items: center; width: 600px; height: 42px; box-sizing: border-box; padding: 0 10px 0 42px; background: #EFECE5; border: 1px solid #D3CEC4; border-radius: 3px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#625D54" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset-inline-start: 14px; top: 11px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Global Smart Search</span>
    <input type="search" placeholder="Search parts, references, vehicles, customers…" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #26241F">
    <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; color: #625D54; background: #F7F5F0; border: 1px solid #D3CEC4; border-bottom-width: 2px; border-radius: 2px; padding: 1px 6px">Ctrl K</kbd>
  </label>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; border: 1px solid #C9D9CD; border-radius: 2px; background: #E6EFE8; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.03em; color: #226B40">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>
    <span>LOCAL · SAVED 17:04</span>
    <span style="width: 1px; height: 14px; background: #B7CDBD"></span>
    <span style="color: #4F7F60">BACKUP 13:40</span>
  </div>

  <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #D3CEC4; border-radius: 3px; background: #F7F5F0; color: #3A362F; cursor: pointer">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    <span style="position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; justify-content: center; border-radius: 2px; background: #C8471B; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600">3</span>
  </button>

  <button type="button" aria-label="Account menu" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px 0 4px; border: 1px solid transparent; border-radius: 3px; background: transparent; font-family: inherit; cursor: pointer; color: #26241F">
    <span style="width: 34px; height: 34px; border-radius: 3px; background: #1E1D1A; color: #F7F5F0; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-size: 13px; font-weight: 700">YB</span>
    <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px">
      <span style="font-size: 14px; font-weight: 600; color: #1B1A17">Yacine Benali</span>
      <span style="font-size: 12px; color: #625D54">Owner</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625D54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1688,"height":60}}'>

</body>
