<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoPartsOS top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 1688px; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #F7F8FA; border-bottom: 1px solid #D7DCE3; font-family: Inter, 'Noto Sans Arabic', system-ui, sans-serif; color: #172033">
  <label style="position: relative; display: flex; align-items: center; width: 560px; height: 42px; box-sizing: border-box; padding: 0 12px 0 40px; background: #F4F8FF; border: 1px solid #D7DCE3; border-radius: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset-inline-start: 13px; top: 11px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Global Smart Search</span>
    <input type="search" placeholder="Search AutoPartsOS…" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #172033">
    <span style="display: flex; gap: 4px">
      <kbd style="font-family: inherit; font-size: 12px; font-weight: 500; color: #667085; background: #F7F8FA; border: 1px solid #D7DCE3; border-radius: 5px; padding: 2px 6px">Ctrl</kbd>
      <kbd style="font-family: inherit; font-size: 12px; font-weight: 500; color: #667085; background: #F7F8FA; border: 1px solid #D7DCE3; border-radius: 5px; padding: 2px 6px">K</kbd>
    </span>
  </label>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; background: #EAF6EE; color: #0F7A33; font-size: 13px; font-weight: 500">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #16A344"></span>
    <span>Local · All changes saved</span>
    <span style="color: #4E8F63">· Backup 13:40</span>
  </div>

  <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #344054; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    <span style="position: absolute; top: 9px; inset-inline-end: 10px; width: 8px; height: 8px; border-radius: 50%; background: #2563EB; border: 2px solid #F7F8FA"></span>
  </button>

  <div style="width: 1px; height: 28px; background: #D7DCE3"></div>

  <button type="button" aria-label="Account menu" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 4px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; cursor: pointer; color: #172033">
    <span style="width: 34px; height: 34px; border-radius: 50%; background: #14213D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">YB</span>
    <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px">
      <span style="font-size: 14px; font-weight: 600; color: #172033">Yacine Benali</span>
      <span style="font-size: 12px; color: #667085">Owner</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1688,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
