<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","pos","sales","products","stock","purchases","customers","suppliers","returns","reports","users","settings"]},"collapsed":{"editor":"boolean","default":false},"$preview":{"width":232,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const collapsed = !!this.props.collapsed;
    const keys = ['dashboard','pos','sales','products','stock','purchases','customers','suppliers','returns','reports','users','settings'];
    const n = {};
    keys.forEach((k) => {
      const on = k === active;
      n[k] = {
        cur: on ? 'page' : 'false',
        bg: on ? '#2D2A25' : 'transparent',
        fg: on ? '#FFFFFF' : '#B9B3A7',
        ic: on ? '#E8622C' : '#8F897E',
        bar: on ? '#E8622C' : 'transparent',
        wt: on ? 600 : 500
      };
    });
    return {
      n,
      w: collapsed ? '68px' : '232px',
      labelDisplay: collapsed ? 'none' : 'flex',
      justify: collapsed ? 'center' : 'flex-start',
      brandPad: collapsed ? '0px' : '20px',
      collapseLabel: collapsed ? 'Expand sidebar' : 'Collapse sidebar'
    };
  }
}
</script>
