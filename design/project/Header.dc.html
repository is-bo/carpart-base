<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoPartsOS header and index tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
nav a[aria-current="false"]:hover{background:#3A3834 !important;color:#FFFFFF !important}
nav a{transition:background-color .12s,color .12s}
</style>
</helmet>
<header style="width: 1920px; height: 104px; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif">
  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 24px; background: #1E1D1A; color: #F8F7F4">
    <a href="Dashboard.dc.html" aria-label="AutoPartsOS home" style="display: flex; align-items: center; gap: 11px; text-decoration: none; width: 250px">
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true" style="flex-shrink: 0"><path d="M15 1.5 26.7 8.25v13.5L15 28.5 3.3 21.75V8.25Z" fill="#86BDB8"></path><circle cx="15" cy="15" r="5.2" fill="none" stroke="#1E1D1A" stroke-width="2.6"></circle></svg>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: Archivo, sans-serif; font-stretch: 118%; font-size: 15px; font-weight: 800; letter-spacing: 0.03em; color: #F8F7F4; line-height: 1">AUTOPARTS<span style="color: #86BDB8">OS</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.04em; color: #B9B6AF; line-height: 1">BLIDA · TILL 01</span>
      </span>
    </a>

    <label style="position: relative; display: flex; align-items: center; width: 760px; height: 40px; box-sizing: border-box; padding: 0 8px 0 42px; background: #2B2A27; border: 1px solid #45423C; border-radius: 3px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9B6AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset-inline-start: 14px; top: 10px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Global Smart Search</span>
      <input type="search" placeholder="Search parts, references, vehicles, customers — or type a command" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #F8F7F4">
      <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; color: #B9B6AF; border: 1px solid #45423C; border-bottom-width: 2px; border-radius: 2px; padding: 1px 6px">F2</kbd>
    </label>

    <span style="flex-grow: 1"></span>

    <span style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid #2F4A38; border-radius: 2px; background: #1F2A22; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; letter-spacing: 0.03em; color: #8FCBA4">
      <span style="width: 7px; height: 7px; background: #4FB477"></span>LOCAL · SAVED 17:09 · BACKUP 13:40
    </span>

    <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #45423C; border-radius: 3px; background: transparent; color: #E6E5E1; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; justify-content: center; border-radius: 2px; background: #86BDB8; color: #1B1A17; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">3</span>
    </button>

    <button type="button" aria-label="Account menu" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 3px; border: 0; border-radius: 3px; background: transparent; font-family: inherit; cursor: pointer; color: #F8F7F4">
      <span style="width: 32px; height: 32px; border-radius: 3px; background: #F8F7F4; color: #1B1A17; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-size: 13px; font-weight: 800">YB</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px">
        <span style="font-size: 14px; font-weight: 600">Yacine Benali</span>
        <span style="font-size: 13px; color: #B9B6AF">Owner</span>
      </span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B9B6AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>

  <nav aria-label="Sections" style="height: 52px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: flex-end; gap: 4px; padding: 0 16px; background: #2E2C29; border-top: 1px solid #45423C">
    <sc-for list="{{main}}" as="t" hint-placeholder-count="10">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="position: relative; display: flex; align-items: center; gap: 9px; height: {{t.h}}; box-sizing: border-box; padding: 0 18px; border-top: 4px solid {{t.top}}; border-radius: 5px 5px 0 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 15.5px; font-weight: {{t.wt}}; text-decoration: none; white-space: nowrap">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: {{t.numFg}}">{{t.num}}</span>{{t.label}}<sc-if value="{{t.hasCount}}" hint-placeholder-val="{{false}}"><span style="padding: 0 6px; border-radius: 3px; background: #E9C95A; color: #1B1A17; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; line-height: 20px">{{t.count}}</span></sc-if>
      </a>
    </sc-for>
    <span style="flex-grow: 1"></span>
    <span style="align-self: center; width: 1px; height: 24px; background: #55524C; margin: 0 10px"></span>
    <sc-for list="{{admin}}" as="t" hint-placeholder-count="2">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="position: relative; display: flex; align-items: center; gap: 8px; height: {{t.h}}; box-sizing: border-box; padding: 0 16px; border-top: 4px solid {{t.top}}; border-radius: 5px 5px 0 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: {{t.wt}}; text-decoration: none; white-space: nowrap">{{t.label}}</a>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","pos","sales","products","stock","purchases","customers","suppliers","returns","reports","users","settings"]},"$preview":{"width":1920,"height":104}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const tab = (key, label, href, num, count) => {
      const on = key === active;
      return {
        label, href, num: num || '', count: count || '', hasCount: !!count,
        cur: on ? 'page' : 'false',
        h: on ? '46px' : '42px',
        bg: on ? '#E2E0DA' : 'transparent',
        top: on ? '#2F6F73' : 'transparent',
        fg: on ? '#1B1A17' : '#ECEAE5',
        numFg: on ? '#1F5A5E' : '#A9A59D',
        wt: on ? 700 : 500
      };
    };
    return {
      main: [
        tab('dashboard', 'Dashboard', 'Dashboard.dc.html', '01'),
        tab('pos', 'POS', 'Pos.dc.html', '02'),
        tab('sales', 'Sales', 'Sales.dc.html', '03'),
        tab('products', 'Products', 'Products.dc.html', '04'),
        tab('stock', 'Stock', 'Stock.dc.html', '05', '29'),
        tab('purchases', 'Purchases', 'Purchases.dc.html', '06'),
        tab('customers', 'Customers', 'Customers.dc.html', '07'),
        tab('suppliers', 'Suppliers', 'Suppliers.dc.html', '08'),
        tab('returns', 'Returns', 'Returns.dc.html', '09'),
        tab('reports', 'Reports', 'Reports.dc.html', '10')
      ],
      admin: [
        tab('users', 'Users & Roles', 'Users.dc.html'),
        tab('settings', 'Settings', 'Settings.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
