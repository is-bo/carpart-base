<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users &amp; Roles — AutoPartsOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E6E5E1}
a{color:#1F5A5E;text-decoration:none}a:hover{color:#174649}
button,a{transition:background-color .12s,border-color .12s,color .12s}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: #E6E5E1; font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #26241F; font-variant-numeric: tabular-nums">
  <dc-import name="Header" active="users" hint-size="1920px,104px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 28px; background: #F8F7F4; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
        <div style="display: flex; align-items: flex-end; gap: 28px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 115%; font-size: 30px; font-weight: 700; letter-spacing: -0.015em; color: #1B1A17">Users &amp; Roles</h1>
            <span style="font-size: 13.5px; color: #5E5B55">8 people can sign in to this store. Drag a person to another column to change their role.</span>
          </div>
          <div role="tablist" aria-label="View" style="display: flex; gap: 18px; padding-bottom: 2px">
            <button type="button" role="tab" aria-selected="true" style="height: 30px; padding: 0; border: 0; border-bottom: 2px solid #2F6F73; background: transparent; color: #1B1A17; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">People by role</button>
            <button type="button" role="tab" aria-selected="false" style="height: 30px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #5E5B55; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Permissions table</button>
          </div>
        </div>
        <button type="button" style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; border-radius: 3px; border: 0; background: #1F5A5E; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add a person</button>
      </div>

      <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 0; border-top: 2px solid #1B1A17">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
          <section aria-label="{{r.name}}" style="min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-inline-start: {{r.sep}}; background: {{r.colBg}}">
            <div style="display: flex; flex-direction: column; gap: 6px; min-height: 92px">
              <div style="display: flex; align-items: center; gap: 8px">
                <h2 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 110%; font-size: 19px; font-weight: 700; color: #1B1A17">{{r.name}}</h2>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #5E5B55">{{r.count}}</span>
                <sc-if value="{{r.optional}}" hint-placeholder-val="{{false}}">
                  <span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border: 1px dashed #8B877F; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; color: #5E5B55">OPTIONAL</span>
                </sc-if>
              </div>
              <span style="font-size: 13px; line-height: 1.45; color: #5E5B55">{{r.desc}}</span>
            </div>

            <sc-for list="{{r.people}}" as="p" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: {{p.cardBg}}; border: 1px solid #D5D2CB; border-inline-start: 3px solid {{p.stripe}}; border-radius: 3px">
                <div style="display: flex; align-items: center; gap: 12px">
                  <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 3px; background: {{p.avBg}}; color: {{p.avFg}}; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-size: 13px; font-weight: 800">{{p.initials}}</span>
                  <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                    <span style="font-size: 15px; font-weight: 600; color: {{p.nameFg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}{{p.you}}</span>
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5B55">@{{p.username}} · {{p.signin}}</span>
                  </span>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: #5E5B55">
                  <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px 0 6px; border-radius: 2px; border-inline-start: 3px solid {{p.b.dot}}; background: {{p.b.bg}}; color: {{p.b.fg}}; font-size: 11.5px; font-weight: 600">{{p.b.label}}</span>
                  <span>{{p.last}}</span>
                </div>
              </div>
            </sc-for>

            <sc-if value="{{r.empty}}" hint-placeholder-val="{{false}}">
              <button type="button" style="height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px dashed #B8B5AE; border-radius: 3px; background: transparent; color: #4C4944; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
                No one has this role
                <span style="font-size: 12.5px; font-weight: 400; color: #5E5B55">Assign someone, or leave it unused</span>
              </button>
            </sc-if>

            <span style="flex-grow: 1"></span>
            <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid #D5D2CB">
              <span style="font-family: Archivo, sans-serif; font-stretch: 108%; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: #5E5B55">CAN</span>
              <span style="font-size: 13px; line-height: 1.5; color: #26241F">{{r.can}}</span>
              <a href="#" style="font-size: 13px; font-weight: 600">Edit permissions</a>
            </div>
          </section>
        </sc-for>
      </div>
    </main>
    <dc-import name="Ticket" hint-size="96px,976px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      active: { label: 'Active', bg: '#E1EEE4', fg: '#226B40', dot: '#2E7D4F' },
      disabled: { label: 'Disabled', bg: '#E6E5E1', fg: '#4C4944', dot: '#8B877F' },
      invited: { label: 'Set-up pending', bg: '#E3E8EE', fg: '#465770', dot: '#5A6B80' }
    };
    const person = (name, username, signin, status, last, owner, you) => ({
      name, username, signin, last, b: S[status], you: you ? ' (you)' : '',
      initials: name.split(' ').map((w) => w[0]).join('').slice(0, 2),
      avBg: status === 'disabled' ? '#E6E5E1' : (owner ? '#1B1A17' : '#EFEEEA'),
      avFg: status === 'disabled' ? '#8B877F' : (owner ? '#F8F7F4' : '#1B1A17'),
      nameFg: status === 'disabled' ? '#5E5B55' : '#1B1A17',
      cardBg: status === 'disabled' ? 'transparent' : '#FFFFFF',
      stripe: you ? '#2F6F73' : (status === 'disabled' ? '#D5D2CB' : '#1B1A17')
    });
    const role = (name, count, desc, can, people, optional, i) => ({
      name, count, desc, can, people, optional: !!optional, empty: people.length === 0,
      sep: i === 0 ? '0' : '1px solid #D5D2CB',
      colBg: optional ? '#F2F1EE' : 'transparent'
    });
    return {
      roles: [
        role('Owner', '2', 'Full access. A store can have several owners; the last active owner can’t be removed.', 'Everything, including users, backups, profit and settings.', [
          person('Yacine Benali', 'yacine', 'password', 'active', 'Now', true, true),
          person('Amina Benali', 'amina', 'password', 'active', 'Today 15:12', true)
        ], false, 0),
        role('Manager', '1', 'Runs the day: prices, purchases, returns and most reports.', 'Sell, change prices, receive purchases, approve returns, see sales and stock reports.', [
          person('Mehdi Larbi', 'mehdi', 'password', 'active', 'Yesterday')
        ], false, 1),
        role('General Employee', '4', 'Sells, looks up parts and customers, receives goods.', 'Sell, search, add customers, receive purchases. No prices, no profit.', [
          person('Hichem Saadi', 'hichem', 'PIN', 'active', 'Today 12:05'),
          person('Rym Touati', 'rym', 'PIN', 'active', '22 Sep'),
          person('Anis Ferhat', 'anis', 'PIN', 'invited', 'Never'),
          person('Walid Guerfi', 'walid', 'PIN', 'disabled', '02 Aug')
        ], false, 2),
        role('Cashier', '1', 'POS and customer payments only.', 'Sell at the POS and take customer payments.', [
          person('Sofiane Mokrani', 'sofiane', 'PIN', 'active', 'Today 16:51')
        ], true, 3),
        role('Inventory Clerk', '0', 'Stock counts, adjustments and receiving.', 'Count stock, adjust quantities, receive purchases.', [], true, 4)
      ]
    };
  }
}
</script>
</body>
</html>
